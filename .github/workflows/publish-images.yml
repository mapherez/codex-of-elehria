name: Publish Images

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to publish (for example, latest or 1.2.0)
        required: true
        default: latest
        type: string

permissions:
  contents: read

concurrency:
  group: publish-images
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate branch and image tag
        env:
          PUBLISH_REF: ${{ github.ref }}
          IMAGE_TAG: ${{ inputs.tag }}
        run: |
          if [[ "$PUBLISH_REF" != "refs/heads/master" ]]; then
            echo "::error::Publish Images must run from master."
            exit 1
          fi
          if [[ ! "$IMAGE_TAG" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]] || [[ "$IMAGE_TAG" == sha-* ]]; then
            echo "::error::Use a valid Docker tag of up to 128 characters. The sha- prefix is reserved for commit tags."
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm test

  publish:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish Public
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          target: public
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/mapherez/nox-wiki-public:${{ inputs.tag }}
            ghcr.io/mapherez/nox-wiki-public:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Build and publish Admin
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          target: admin
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/mapherez/nox-wiki-admin:${{ inputs.tag }}
            ghcr.io/mapherez/nox-wiki-admin:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
